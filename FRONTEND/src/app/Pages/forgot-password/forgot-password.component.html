<div class="forgot-fondo">
  <div class="forgot-caja">
    <h2>Recuperar contraseña</h2>
    <p>Introduce tu correo y te enviaremos un código para restablecer la contraseña.</p>

    <div *ngIf="message" class="mensaje">{{ message }}</div>

    <div class="campo">
      <label>Correo</label>
      <input type="email" [(ngModel)]="email" />
    </div>

    <button (click)="enviar()" [disabled]="loading">{{ loading ? 'Enviando...' : 'Enviar código' }}</button>
  </div>
</div>
